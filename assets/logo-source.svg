</g>

<circle cx="340" cy="130" r="30" fill="#FFFFFF"/>

<text x="340" y="418" text-anchor="middle" font-family="Arial Black, Helvetica, sans-serif" font-style="italic" font-size="64" font-weight="800"><tspan fill="#E4002B">Go</tspan><tspan fill="#151515">Muscu</tspan></text>

<text x="340" y="452" text-anchor="middle" font-family="Arial Black, Helvetica, sans-serif" font-size="19" font-weight="700" letter-spacing="2" fill="#151515">PAS DE PAUSE. PAS D'EXCUSE.</text>
